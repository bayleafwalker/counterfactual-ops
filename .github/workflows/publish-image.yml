name: Publish service image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          build-args: CFO_SOURCE_REVISION=${{ github.sha }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/counterfactual-ops:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/counterfactual-ops:sha-${{ github.sha }}
      - name: Generate build provenance attestation
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/counterfactual-ops
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
